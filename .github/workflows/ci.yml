name: CI

# When the pipeline runs: on every pull request, and on every push to main
# (a push to main only happens through a merged pull request, once the ruleset is on).
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: by default the workflow can only read the code.
# Jobs that need more ask for it explicitly.
permissions:
  contents: read

# If you push twice to the same PR, cancel the older, now-useless run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- Job 1: same checks you run locally ----------
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true          # reuse downloaded packages between runs

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  # ---------- Job 2: build the image (and publish it only from main) ----------
  image:
    name: Build image
    needs: quality                    # never build an image from code that fails tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # needed to push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v7

      # QEMU lets this x86 runner build the ARM image for the Oracle server.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # temporary token GitHub creates per run

      # Tags: sha-<commit> on every build (traceable, never overwritten),
      # plus "latest" on main.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push from main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
