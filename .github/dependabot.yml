# Dependabot version updates: a weekly PR when something we depend on has a new version.
# (Security fixes are separate: "Dependabot security updates" in Settings opens those right away.)
version: 2

updates:
  # Python packages, read from pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a few days before proposing a brand-new release: most broken or
    # malicious releases are caught and pulled within that window.
    cooldown:
      default-days: 5
    # One PR for all minor/patch bumps instead of one PR per package.
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base images in the Dockerfile (python:3.13-slim, the uv image)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5

  # Actions used in .github/workflows (checkout, setup-uv, docker/*)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
